name: Update Remix Icons

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-icons:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Get current remixicon version
        id: current
        run: echo "version=$(node -p "require('./package.json').devDependencies.remixicon.replace('^', '')")" >> $GITHUB_OUTPUT

      - name: Get latest remixicon version
        id: latest
        run: echo "version=$(pnpm view remixicon version)" >> $GITHUB_OUTPUT

      - name: Check if update needed
        id: check
        run: |
          if [ "${{ steps.current.outputs.version }}" = "${{ steps.latest.outputs.version }}" ]; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "remixicon is up to date (${{ steps.current.outputs.version }})"
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "New version available: ${{ steps.latest.outputs.version }} (current: ${{ steps.current.outputs.version }})"
          fi

      - name: Update remixicon and regenerate icons
        if: steps.check.outputs.needs_update == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm add -D remixicon@${{ steps.latest.outputs.version }}
          pnpm run generate

      - name: Create Pull Request
        if: steps.check.outputs.needs_update == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update remixicon to ${{ steps.latest.outputs.version }}'
          title: 'chore: update remixicon to ${{ steps.latest.outputs.version }}'
          body: |
            ## Remix Icon Update

            - **Current version:** `${{ steps.current.outputs.version }}`
            - **New version:** `${{ steps.latest.outputs.version }}`

            This PR was automatically generated by the icon update workflow.
            Icon definitions have been regenerated using `pnpm run generate`.

            ### Checklist
            - [x] Updated remixicon dependency
            - [x] Regenerated icon definitions
            - [ ] Verify build passes
          branch: 'auto/update-remixicon-${{ steps.latest.outputs.version }}'
          delete-branch: true
          labels: automation, dependencies
