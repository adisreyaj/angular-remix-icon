name: Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode'
        type: choice
        options:
          - bump-and-release
          - publish-only
        default: bump-and-release
      version:
        description: 'Bump type (patch, minor, major) or exact version (e.g. 8.2.0). Ignored when mode is publish-only.'
        required: true
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        id: release
        run: |
          MODE="${{ github.event.inputs.mode }}"

          if [[ "$MODE" == "publish-only" ]]; then
            VERSION=$(node -p "require('./projects/angular-remix-icon/package.json').version")
            echo "Publishing existing version from package.json: $VERSION"
            echo "new_version=$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cd projects/angular-remix-icon
          INPUT="${{ github.event.inputs.version }}"
          if [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            npm version "$INPUT" --no-git-tag-version --allow-same-version
          elif [[ "$INPUT" == patch || "$INPUT" == minor || "$INPUT" == major ]]; then
            npm version "$INPUT" --no-git-tag-version
          else
            echo "Invalid version input: $INPUT" >&2
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          cd ../..
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "new_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate icons
        run: pnpm run generate

      - name: Verify generated icons
        run: pnpm run verify:icons

      - name: Build library
        run: pnpm run build:lib

      - name: Unit tests
        run: pnpm run test:unit

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm run test:e2e

      - name: Commit version bump
        if: github.event.inputs.mode != 'publish-only'
        run: |
          VERSION="${{ steps.release.outputs.new_version }}"
          git add package.json projects/angular-remix-icon/package.json
          if git diff --staged --quiet; then
            echo "No version file changes to commit."
          else
            git commit -m "chore: release v${VERSION}"
          fi

      - name: Tag and push release
        run: |
          VERSION="${{ steps.release.outputs.new_version }}"
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.new_version }}
          name: Release v${{ steps.release.outputs.new_version }}
          generate_release_notes: true

      - name: Publish to npm
        run: pnpm publish ./dist/angular-remix-icon --access public --provenance
