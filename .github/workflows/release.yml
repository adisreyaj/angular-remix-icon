name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch, minor, major) or custom version (e.g., 8.0.0)'
        required: true
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump library version
        id: bump
        working-directory: projects/angular-remix-icon
        run: |
          INPUT="${{ github.event.inputs.version }}"
          if [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            npm version "$INPUT" --no-git-tag-version --allow-same-version
          elif [[ "$INPUT" == patch || "$INPUT" == minor || "$INPUT" == major ]]; then
            npm version "$INPUT" --no-git-tag-version
          else
            echo "Invalid version input: $INPUT" >&2
            exit 1
          fi
          echo "new_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Sync root package.json version
        run: npm version ${{ steps.bump.outputs.new_version }} --no-git-tag-version --allow-same-version

      - name: Generate icons
        run: npm run generate

      - name: Verify generated icons
        run: npm run verify:icons

      - name: Build library
        run: npm run build:lib

      - name: Unit tests
        run: npm run test:unit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Commit version bump and tag
        run: |
          VERSION="${{ steps.bump.outputs.new_version }}"
          git add package.json package-lock.json projects/angular-remix-icon/package.json
          git commit -m "chore: release v${VERSION}"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          name: Release v${{ steps.bump.outputs.new_version }}
          generate_release_notes: true

      - name: Publish to npm
        run: npm publish ./dist/angular-remix-icon --access public --provenance
